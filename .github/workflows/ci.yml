name: QuickNotes CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  vet:
    name: vet
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('app/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Run go vet
        working-directory: app
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('app/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Run tests
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('app/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5.0
          working-directory: app
